plugins {
    id "com.android.library"
}

android {
    namespace "androidx.media3.decoder.ffmpeg"
    compileSdk 35
    defaultConfig { minSdk 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir("jniLibs"))
}

tasks.register("buildNative", Exec) {
    inputs.file("build-native.sh")
    inputs.file("src/main/jni/ffmpeg_jni.cc")
    outputs.dir(layout.buildDirectory.dir("jniLibs"))
    commandLine "bash", file("build-native.sh"), android.sdkDirectory
}
tasks.named("preBuild").configure { dependsOn("buildNative") }

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-decoder:1.5.1"
    implementation "androidx.annotation:annotation:1.9.1"
    compileOnly "org.checkerframework:checker-qual:3.13.0"
    compileOnly "org.jetbrains.kotlin:kotlin-annotations-jvm:1.9.24"
}
